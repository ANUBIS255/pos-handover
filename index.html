<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10243a"><meta name="description" content="سجل استلام وتسليم ماكينات نقاط البيع">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
<title>سجل تسليم الماكينات</title>
</head>
<body>
<header><div class="brand">POS <span>HANDOVER</span></div><div class="sub">سجل استلام وتسليم الماكينات</div></header>
<main>
<nav class="tabs"><button class="tab active" data-tab="new">محضر جديد</button><button class="tab" data-tab="records">السجل</button></nav>
<section id="new" class="panel">
  <div class="section-title">بيانات المحضر</div>
  <div class="meta"><span>رقم المحضر: <b id="serial">—</b></span><span id="date"></span></div>
  <form id="handoverForm">
    <label>القرية <input name="village" required maxlength="80" placeholder="اسم القرية"></label>
    <label>اسم التاجر <input name="merchant" required maxlength="100" placeholder="اسم التاجر"></label>
    <label>رقم الماكينة <input name="machine" required inputmode="numeric" maxlength="40" placeholder="رقم الماكينة"></label>
    <label>رقم التليفون <input name="phone" required inputmode="tel" maxlength="20" placeholder="رقم التليفون"></label>
    <div class="section-title small">الملحقات المستلمة</div>
    <div class="checks"><label><input type="checkbox" name="charger"> شاحن</label><label><input type="checkbox" name="battery"> بطارية</label><label><input type="checkbox" name="sim"> شريحة خط</label></div>
    <div class="section-title small">الموقع الجغرافي</div>
    <div class="gps"><span id="gpsStatus">لم يتم تحديد الموقع</span><button type="button" class="secondary" id="gpsBtn">تحديد موقعي</button></div>
    <input type="hidden" name="lat"><input type="hidden" name="lng">
    <label>صورة المستند (JPG) <input id="photo" type="file" accept="image/jpeg,image/*" capture="environment"></label>
    <img id="preview" class="preview hidden" alt="معاينة الصورة">
    <label class="ack"><input type="checkbox" name="ack" required> أقر بأن بيانات المحضر تم تأكيدها والموافقة عليها من التاجر، وذلك في حضور مندوب المنطقة السابق ومشرف المنطقة.</label>
    <button class="primary" type="submit">حفظ المحضر</button>
    <p class="hint">يُحفظ السجل على هذا الجهاز دون الحاجة إلى الإنترنت. احتفظ بنسخة احتياطية من بياناتك بانتظام.</p>
  </form>
</section>
<section id="records" class="panel hidden">
  <div class="section-title">المحاضر المحفوظة</div>
  <input id="search" placeholder="ابحث بالاسم أو رقم الماكينة أو القرية">
  <div id="recordList" class="record-list"></div>
  <button id="exportAll" class="secondary full">تصدير نسخة احتياطية (JSON)</button>
  <label class="import-label">استيراد نسخة احتياطية <input id="importFile" type="file" accept="application/json"></label>
</section>
</main>
<div id="toast" role="status"></div>
<dialog id="detailDialog"><div id="detailContent"></div><button class="secondary full" id="closeDialog">إغلاق</button></dialog>
<script src="app.js"></script>
</body></html>
